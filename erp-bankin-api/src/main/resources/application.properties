spring.application.name=erp-banking-api


# ==========================
# DATABASE
# ==========================

spring.datasource.url=jdbc:postgresql://localhost:5432/erp_banking

spring.datasource.username=postgres

spring.datasource.password=sandra

spring.datasource.driver-class-name=org.postgresql.Driver


# ==========================
# JPA
# ==========================

# Le schema est desormais versionne par Flyway (db/migration) : Hibernate ne
# doit plus le modifier tout seul, il doit seulement verifier que le mapping
# correspond a ce que la base contient reellement.
spring.jpa.hibernate.ddl-auto=validate


# ==========================
# FLYWAY (migrations de schema)
# ==========================
# L'historique remonte a V1 ; a l'introduction de Flyway, la base existait
# deja : on la marque comme etant a la version 0 pour que V1 soit la premiere
# migration reellement appliquee.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true


