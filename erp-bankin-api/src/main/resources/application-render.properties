spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

server.port=${PORT:8080}
app.frontend-url=${APP_FRONTEND_URL}
app.backend-url=${APP_BACKEND_URL}
app.cors.allowed-origins=${APP_FRONTEND_URL}

application.security.jwt.secret-key=${APPLICATION_SECURITY_JWT_SECRET_KEY}

spring.jpa.show-sql=false
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}

app.firebase.service-account=${FIREBASE_SERVICE_ACCOUNT_PATH:}
